<!DOCTYPE html>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(circle at top left,rgba(56,189,248,.24),transparent 34%),radial-gradient(circle at top right,rgba(250,204,21,.20),transparent 30%),linear-gradient(135deg,#020617,#111827 45%,#1e1b4b);color:#fff;min-height:100vh}header{text-align:center;padding:30px 14px 10px}h1{margin:0;color:#fde047;font-size:clamp(28px,5vw,46px);letter-spacing:.02em}.lead{color:#d1d5db;line-height:1.75;margin:12px auto 0;max-width:760px}.layout{width:min(1120px,100%);margin:auto;padding:14px;display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}.card,.ad,.note{background:rgba(15,23,42,.94);border:1px solid rgba(255,255,255,.10);border-radius:24px;box-shadow:0 18px 45px rgba(0,0,0,.35);backdrop-filter:blur(10px)}.card{padding:clamp(18px,4vw,32px)}.ad{padding:12px;position:sticky;top:12px;overflow:hidden}.adlabel{font-size:12px;color:#9ca3af;text-align:center;margin-bottom:8px}.note{padding:15px;margin-top:14px;color:#d1d5db;font-size:14px;line-height:1.7}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.tag{display:inline-block;background:#0e7490;color:#cffafe;padding:7px 13px;border-radius:999px;font-weight:900}.counter{color:#d1d5db;font-weight:900}.bar{height:10px;background:#334155;border-radius:999px;overflow:hidden;margin-bottom:22px}.bar span{display:block;height:100%;width:0%;background:linear-gradient(90deg,#22d3ee,#fde047);transition:.25s}.question{font-size:clamp(22px,4vw,32px);font-weight:950;line-height:1.55;margin:14px 0 20px}.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:16px 0}.vs{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;background:#fde047;color:#111827;font-weight:950;box-shadow:0 8px 20px rgba(253,224,71,.25)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{width:100%;min-height:118px;border:0;border-radius:20px;padding:16px;background:#1f2937;color:white;font-size:clamp(17px,3vw,22px);font-weight:950;text-align:center;cursor:pointer;transition:.15s;border:1px solid rgba(255,255,255,.08)}.choices button:hover:not(:disabled){transform:translateY(-2px);background:#334155}.choices button.correct{background:#16a34a!important}.choices button.wrong{background:#dc2626!important}.choices button:disabled{cursor:default;opacity:.98}.year{display:block;margin-top:8px;font-size:13px;color:#cbd5e1;font-weight:800}.result{display:none;margin-top:18px;min-height:88px;padding:15px;border-radius:18px;background:rgba(2,6,23,.70);color:#e5e7eb;line-height:1.75;border:1px solid rgba(255,255,255,.08)}.result b{color:#fde047}.score{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#d1d5db;margin-top:16px;font-weight:900}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:950;cursor:pointer;background:#fde047;color:#111827}.btn.sub{background:#475569;color:#fff}.final{text-align:center;padding:22px 0}.finalscore{font-size:clamp(38px,8vw,68px);color:#fde047;font-weight:950;margin:10px 0}.small{font-size:13px;color:#94a3b8;margin-top:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.ad{position:static}.choices{grid-template-columns:1fr}.versus{grid-template-columns:1fr}.vs{margin:auto}.choices button{min-height:92px}}
</style>
</head>
<body>
<header>
  <h1>先に起きたのどっち？クイズ</h1>
  <p class="lead">ピラミッド vs ローマ帝国、YouTube vs iPhoneなど、時代感覚がバグる2択クイズ。<br>総数200問からランダムで20問出題。</p>
</header>
<main class="layout">
<section class="card" id="card">
  <div class="top"><div class="tag" id="genre"></div><div class="counter" id="counter"></div></div>
  <div class="bar"><span id="progress"></span></div>
  <div class="question" id="question"></div>
  <div class="versus"><div class="choices" id="choices"></div></div>
  <div class="result" id="result"></div>
  <div class="score"><span id="score"></span><span>問題総数：200問</span></div>
  <div class="controls"><button class="btn sub" id="skip">スキップ</button><button class="btn sub" id="restart">最初から</button></div>
</section>
<aside>
  <div class="ad">
    <div class="adlabel">広告</div>
    <!-- チェス -->
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-8398161859137802" data-ad-slot="5599163841" data-ad-format="auto" data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>
  <div class="note"><b>遊び方</b><br>「どちらが先に起きた・登場したか」を選んでください。回答後、約1.2秒で自動的に次の問題へ進みます。</div>
</aside>
</main>
<script>
const quizData = [
{g:'古代史',a:'ギザの大ピラミッド完成',ay:'紀元前2560<br><b>先は「${answerText}」</b>（${answerYear}）<br>${q.ex}`;
  scoreEl.textContent = `正解数：${correct}`;

  setTimeout(next, 1200);
}

function next(){
  current++;
  if(current >= TOTAL_QUESTIONS){
    showFinal();
  }else{
    showQuestion();
  }
}

function showFinal(){
  progressEl.style.width = '100%';
  const rate = Math.round((correct / TOTAL_QUESTIONS) * 100);
  let msg = '時代感覚、かなり強い！';
  if(rate === 100) msg = '完全制覇！歴史タイムトラベラー級！';
  else if(rate >= 80) msg = 'すごい！時系列マスター級！';
  else if(rate >= 60) msg = 'いい感じ！あと少しで歴史通！';
  else if(rate >= 40) msg = '時代感覚がちょっとバグってます！';
  else msg = '逆においしい結果！もう一回やろう！';

  card.innerHTML = `<div class="final">
    <div class="tag">結果発表</div>
    <div class="finalscore">${correct} / ${TOTAL_QUESTIONS}</div>
    <p>${msg}</p>
    <p class="small">正答率：${rate}% ／ 問題総数：200問</p>
    <button class="btn" onclick="location.reload()">もう一回遊ぶ</button>
  </div>`;
}

skipBtn.onclick = ()=>{ if(!locked) next(); };
restartBtn.onclick = start;
start();
</script>
</body>
</html>
