const TOTAL_QUESTIONS = 20;
let questions = [];
let current = 0;
let correct = 0;
let locked = false;

const genreEl = document.getElementById('genre');
const counterEl = document.getElementById('counter');
const progressEl = document.getElementById('progress');
const questionEl = document.getElementById('question');
const choicesEl = document.getElementById('choices');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const skipBtn = document.getElementById('skip');
const restartBtn = document.getElementById('restart');
const card = document.getElementById('card');

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-0.5);
}

function start(){
  questions = shuffle(quizData).slice(0, TOTAL_QUESTIONS);
  current = 0;
  correct = 0;
  locked = false;
  showQuestion();
}

function showQuestion(){
  locked = false;
  resultEl.style.display = 'none';
  resultEl.innerHTML = '';
  const q = questions[current];
  genreEl.textContent = q.g;
  counterEl.textContent = `${current+1} / ${TOTAL_QUESTIONS}`;
  progressEl.style.width = `${(current / TOTAL_QUESTIONS) * 100}%`;
  questionEl.textContent = '先に起きた・登場したのはどっち？';
  scoreEl.textContent = `正解数：${correct}`;

  const opts = [
    {key:'a', text:q.a, year:q.ay},
    {key:'b', text:q.b, year:q.by}
  ];
  choicesEl.innerHTML = '';
  shuffle(opts).forEach(opt=>{
    const btn = document.createElement('button');
    btn.innerHTML = `${opt.text}<span class="year">${opt.year}</span>`;
    btn.onclick = ()=>answer(opt.key, btn);
    choicesEl.appendChild(btn);
  });
}

function answer(key, clickedBtn){
  if(locked) return;
  locked = true;
  const q = questions[current];
  const buttons = [...choicesEl.querySelectorAll('button')];
  buttons.forEach(btn=>btn.disabled=true);

  const isCorrect = key === q.ans;
  if(isCorrect) correct++;

  buttons.forEach(btn=>{
    const text = btn.textContent;
    if((q.ans === 'a' && text.includes(q.a)) || (q.ans === 'b' && text.includes(q.b))){
      btn.classList.add('correct');
    }
  });
  if(!isCorrect) clickedBtn.classList.add('wrong');

  const answerText = q.ans === 'a' ? q.a : q.b;
  const answerYear = q.ans === 'a' ? q.ay : q.by;
  resultEl.style.display = 'block';
  resultEl.innerHTML = `${isCorrect ? '✅ 正解！' : '❌ 不正解！'}<br><b>先は「${answerText}」</b>（${answerYear}）<br>${q.ex}`;
  scoreEl.textContent = `正解数：${correct}`;

  setTimeout(next, 1200);
}

function next(){
  current++;
  if(current >= TOTAL_QUESTIONS){
    showFinal();
  }else{
    showQuestion();
  }
}

function showFinal(){
  progressEl.style.width = '100%';
  const rate = Math.round((correct / TOTAL_QUESTIONS) * 100);
  let msg = '時代感覚、かなり強い！';
  if(rate === 100) msg = '完全制覇！歴史タイムトラベラー級！';
  else if(rate >= 80) msg = 'すごい！時系列マスター級！';
  else if(rate >= 60) msg = 'いい感じ！あと少しで歴史通！';
  else if(rate >= 40) msg = '時代感覚がちょっとバグってます！';
  else msg = '逆においしい結果！もう一回やろう！';

  card.innerHTML = `<div class="final">
    <div class="tag">結果発表</div>
    <div class="finalscore">${correct} / ${TOTAL_QUESTIONS}</div>
    <p>${msg}</p>
    <p class="small">正答率：${rate}% ／ 問題総数：200問</p>
    <button class="btn" onclick="location.reload()">もう一回遊ぶ</button>
  </div>`;
}

skipBtn.onclick = ()=>{ if(!locked) next(); };
restartBtn.onclick = start;
start();
</script>
